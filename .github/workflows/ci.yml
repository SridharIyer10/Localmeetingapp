name: CI

# Intake Pro ships for macOS and Windows only. Every change is tested and built on both.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS (Apple Silicon), os: macos-14, bundles: "app,dmg" }
          - { name: Windows (x64), os: windows-latest, bundles: "nsis,msi" }
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          prefix-key: ${{ matrix.os }}-v1

      # Windows: build whisper.cpp for the x64 baseline (no host-CPU/AVX-512
      # specialisation) so the installer runs on any supported machine.
      - name: Portable native build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $hook = (Join-Path $env:GITHUB_WORKSPACE ".github/force-portable-ggml.cmake").Replace('\', '/')
          "CMAKE_PROJECT_INCLUDE=$hook" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Version is single-sourced
        run: node scripts/intake-audit.mjs

      - name: Core tests and evaluation harness
        run: |
          cargo test -p copilot-core
          cargo run -q -p copilot-core --bin copilot-eval -- crates/copilot-core/tests/fixtures/intake_corpus.json

      - name: Frontend checks
        working-directory: frontend
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test

      - name: Build the llama-helper sidecar
        working-directory: frontend
        run: node scripts/build-sidecar.js

      - name: Desktop crate tests
        run: cargo test -p intake-pro --lib

      - name: Build the app
        working-directory: frontend
        run: pnpm tauri build --bundles ${{ matrix.bundles }}

      - name: Verify portable whisper build (Windows)
        if: runner.os == 'Windows'
        run: node .github/verify-portable-ggml.cjs target/release

      - uses: actions/upload-artifact@v4
        with:
          name: intake-pro-${{ runner.os }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error
