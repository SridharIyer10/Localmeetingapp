[workspace]
resolver = "2"
members = [
    "frontend/src-tauri",
    "llama-helper",
    "crates/copilot-core"
]

# Shared workspace settings
[workspace.package]
# The ONE version of the product. Crates inherit it; tauri.conf.json has no version
# (Tauri reads Cargo), and scripts/intake-audit.mjs checks frontend/package.json.
version = "1.0.0"
edition = "2021"
rust-version = "1.77"

# Shared dependencies that can be inherited by workspace members
[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.32.0", features = ["full"] }
